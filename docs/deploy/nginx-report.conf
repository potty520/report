# 填报系统 nginx 站点配置（线上：/etc/nginx/conf.d/report.conf）
#
# ⚠️ 关键点（2026-10-10 踩坑，勿改回 proxy_http_version 1.1）：
#   浏览器曾间歇性报 net::ERR_INVALID_CHUNKED_ENCODING（集中在 /api/todo/summary 等 chunked 响应）。
#   - 先按常规做法改 `proxy_http_version 1.1; + proxy_set_header Connection "";` → 错误反而增多
#     （3/120、6/120 失败）：nginx 复用上游 keep-alive 连接，与 Tomcat 关闭空闲连接的时机撞车，
#     响应流被截断。
#   - 最终采用同机 qingzhang.conf 已验证的写法：回源 HTTP/1.0 + proxy_buffering on +
#     chunked_transfer_encoding off，浏览器端不再看到 chunked 分帧。
#     复测 120/120 成功、0 失败（连跑两轮共 240 次请求 + 16 次导航 0 错误）。
#
# ⚠️ 后续定位（2026-10-11）：残留的间歇性 ERR_INVALID_CHUNKED_ENCODING **不是服务器问题**，
#   而是**客户端系统代理**造成：Windows 系统代理指向本机 v2rayN（127.0.0.1:18080），
#   浏览器经代理出口（日志里来源 IP 为 Cloudflare 段 104.28.x.x）时对 chunked 处理异常；
#   同一台机器的 curl/python 直连（来源 IP 42.89.161.245）从不复现。
#   验证：用 `chrome --no-proxy-server` 跑 60 次 keep-alive 请求 = 60/60 成功、0 错误；
#   向导（含物化）也在绕开代理后一次通过。
#   → 排查此类问题时，先用 --no-proxy-server 排除客户端代理；服务端保留本文件的加固配置。
#
# 部署：cp 本文件到 /etc/nginx/conf.d/report.conf && nginx -t && systemctl reload nginx
# 回滚：cp -f /root/backup-20261010-131700/report.conf.before-chunked-fix /etc/nginx/conf.d/report.conf && nginx -t && systemctl reload nginx

server {
    listen 8091;
    server_name _;

    # 附件上传上限（与后端 spring.servlet.multipart 保持一致：单文件 50MB / 请求 60MB）
    client_max_body_size 60m;

    root /opt/report/web;
    index index.html;

    location /api/ {
        # 后端 Spring Boot（server.port=8763, context-path=/api）
        proxy_pass http://127.0.0.1:8763/api/;
        proxy_http_version 1.0;                 # 见文件头说明：不要改成 1.1
        proxy_set_header Connection "";
        proxy_buffering on;
        chunked_transfer_encoding off;          # 关闭分块回传，避免浏览器 chunked 解析错误
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;
    }

    # SPA：前端路由交给 index.html（BrowserRouter）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
