server:
  port: 8763
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: report-system
  servlet:
    # 附件上传上限：默认 Spring Boot 仅 1MB，会让 >1MB 的附件直接失败
    # （分片上传的每一片也必须小于 max-file-size）
    multipart:
      max-file-size: ${REPORT_UPLOAD_MAX_FILE_MB:50}MB
      max-request-size: ${REPORT_UPLOAD_MAX_REQUEST_MB:60}MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 安全加固：凭证一律从环境变量注入，禁止再写入仓库
    #   REPORT_DB_URL / REPORT_DB_USERNAME / REPORT_DB_PASSWORD
    url: ${REPORT_DB_URL:jdbc:mysql://127.0.0.1:3306/report_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${REPORT_DB_USERNAME:report}
    password: ${REPORT_DB_PASSWORD:}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
  global-config:
    db-config:
      id-type: auto

# ---------------------------------------------------------------------------
# 安全相关配置（全部走环境变量；空值时的行为见各组件注释）
#   REPORT_JWT_SECRET                JWT 签名密钥，≥32 字节，必填（缺省拒绝启动）
#   REPORT_CRYPTO_KEY                敏感字段 AES/GCM 密钥，≥16 位；缺省则明文存储并告警
#   REPORT_CAPTCHA_FIXED_CODE        仅供自动化测试的固定验证码；留空=关闭
#   REPORT_DS_TEST_ALLOWED_HOSTS     允许做连接测试的主机白名单（逗号分隔）；留空=不限制
# ---------------------------------------------------------------------------
report:
  jwt:
    secret: ${REPORT_JWT_SECRET:}
    expire-hours: ${REPORT_JWT_EXPIRE_HOURS:24}
  crypto:
    key: ${REPORT_CRYPTO_KEY:}
  captcha:
    fixed-code: ${REPORT_CAPTCHA_FIXED_CODE:}
  datasource:
    test:
      allowed-hosts: ${REPORT_DS_TEST_ALLOWED_HOSTS:}
      connect-timeout-ms: ${REPORT_DS_TEST_CONNECT_TIMEOUT_MS:3000}
      socket-timeout-ms: ${REPORT_DS_TEST_SOCKET_TIMEOUT_MS:5000}
  # 短信催办（可插拔通道）：默认关闭，只写 rpt_sms_log 不真正发送。
  #   开启：REPORT_SMS_ENABLED=true，并把 provider 切到 chunlan 且提供账号凭据
  sms:
    enabled: ${REPORT_SMS_ENABLED:false}
    provider: ${REPORT_SMS_PROVIDER:log}
    template:
      todo: ${REPORT_SMS_TEMPLATE_TODO:}
      overdue: ${REPORT_SMS_TEMPLATE_OVERDUE:}
      correct: ${REPORT_SMS_TEMPLATE_CORRECT:}
    chunlan:
      url: ${REPORT_SMS_CHUNLAN_URL:https://smssh1.253.com/msg/v1/send/json}
      account: ${REPORT_SMS_ACCOUNT:}
      password: ${REPORT_SMS_PASSWORD:}
  # 外部质检报告服务（可插拔）：默认 none 且不拦截审核
  #   启用：REPORT_QUALITY_PROVIDER=http 且配置 REPORT_QUALITY_URL；
  #   开启审核拦截：REPORT_QUALITY_REQUIRED=true
  quality:
    provider: ${REPORT_QUALITY_PROVIDER:none}
    required: ${REPORT_QUALITY_REQUIRED:false}
    url: ${REPORT_QUALITY_URL:}
    token: ${REPORT_QUALITY_TOKEN:}
    submit-path: ${REPORT_QUALITY_SUBMIT_PATH:/submit}
    query-path: ${REPORT_QUALITY_QUERY_PATH:/query}

logging:
  level:
    com.reportsys: info
